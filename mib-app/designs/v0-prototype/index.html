<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>treqe — Prototipo Navegable</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
  :root {
    --bg:        #F9F7F2;
    --surface:   #FFFFFF;
    --text:      #1C1915;
    --text-sub:  #6B6560;
    --text-dim:  #A09A94;
    --border:    #E5E0D8;
    --border-strong: #C5C0B8;
    --accent:    #1C1915;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-sans: 'IBM Plex Sans', 'Inter', 'Segoe UI', sans-serif;
  }

  body.dark {
    --bg:        #130B00;
    --surface:   #1A1206;
    --text:      #E8E2D6;
    --text-sub:  #A0998F;
    --text-dim:  #6B6560;
    --border:    #3A3630;
    --border-strong: #5A5650;
    --accent:    #E8E2D6;
  }

/* ══════ BOTTOM NAV ══════ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  padding: 0;
  height: 72px;
  padding-bottom: 12px;
  z-index: 100;
  isolation: isolate;
  overflow: hidden;
}

.nav-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.55rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color 0.15s;
  padding: 4px 0;
  flex: 1;
  max-width: 80px;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
}

.nav-item i { font-size: 1rem; }

.nav-item.active { color: var(--text); }
.nav-item.active i { color: var(--text); }

.nav-add-btn {
  width: 40px;
  height: 40px;
  background: var(--text);
  color: var(--bg);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
}

.nav-add-btn i { font-size: 1rem; color: var(--bg); }

.nav-badge {
  width: 5px;
  height: 5px;
  background: var(--text);
  border-radius: 50%;
  position: absolute;
  top: 2px;
  right: 4px;
}

</style>
</head>
<body>
<div class="treqe-header">
  <a href="../v1-catalogo/" class="treqe-logo" href="../v16-portada/">treqe</a>
  <div class="treqe-header-right">
    <a href="../v13-blog/" class="treqe-nav-pill"><i class="fas fa-pen"></i> Blog</a>
    <a href="../v1-catalogo/" class="treqe-nav-pill"><i class="fas fa-th"></i> Catalogo</a>
    <button class="treqe-dark-toggle" onclick="toggleDark()"><i class="fas fa-moon"></i></button>
  </div>
</div>

<div class="phone">
    <!-- Navigation bar -->
    <div class="nav-bar">
      <span class="logo"><a href="../v16-portada/index.html" class="treqe-logo-link"><svg class="treqe-logo" viewBox="0 0 76 24" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="19" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="-1.5" fill="#1C1915">treqe<text x="60" y="19" fill="#1C1915">.</text></text></svg></a></span>
      <select class="nav-select" id="screenSelect" onchange="goTo(this.value)">
        <option value="splash">🚀 Splash</option>
        <option value="onboarding">📱 Onboarding</option>
        <option value="registro">📝 Registro</option>
        <option value="catalogo" selected>🔍 Catálogo</option>
        <option value="detalle">📦 Detalle</option>
        <option value="subir">⬆️ Subir</option>
        <option value="perfil">👤 Perfil</option>
        <option value="notificaciones">🔔 Notificaciones</option>
        <option value="matches">⭐ Mis Matches</option>
        <option value="match">💱 Match</option>
        <option value="seguimiento">📍 Seguimiento</option>
        <option value="ajustes">⚙️ Ajustes</option>
      </select>
      <button class="nav-btn" onclick="navBack()" title="Volver"><i class="fas fa-arrow-left"></i></button>
      <button class="nav-btn primary" onclick="refreshFrame()" title="Recargar"><i class="fas fa-sync-alt"></i></button>
    </div>

    <!-- Quick actions -->
    <div class="quick-actions" id="quickActions">
      <button onclick="goTo('catalogo')" class="active" id="btn-catalogo">Catálogo</button>
      <button onclick="goTo('perfil')" id="btn-perfil">Perfil</button>
      <button onclick="goTo('notificaciones')" id="btn-notificaciones">Notifs</button>
      <button onclick="goTo('matches')" id="btn-matches">Matches</button>
      <button onclick="goTo('subir')" id="btn-subir">Subir</button>
      <button onclick="goTo('match')" id="btn-match">Match</button>
    </div>

    <!-- Loading -->
    <div class="loader" id="loader"><div class="spinner"></div></div>

    <!-- Screen iframe -->
    <iframe id="screenFrame" src="../v1-catalogo/" onload="onFrameLoad()"></iframe>

    <!-- Info bar -->
    <div class="info-bar">
      <span><i class="fas fa-mouse-pointer"></i> Click en pantalla para interactuar</span>
      <span><i class="fas fa-code-branch"></i> v0-prototype</span>
    </div>
  </div>

  <script>
    var SCREENS = {
      'splash':         { path: '../v9-splash/',              name: 'Splash' },
      'onboarding':     { path: '../v5-onboarding/',          name: 'Onboarding' },
      'registro':       { path: '../v10-registro/',           name: 'Registro' },
      'catalogo':       { path: '../v1-catalogo/',            name: 'Catálogo' },
      'detalle':        { path: '../v2-detalle/',             name: 'Detalle' },
      'subir':          { path: '../v3-subir/',               name: 'Subir' },
      'perfil':         { path: '../v4-perfil/',              name: 'Perfil' },
      'notificaciones': { path: '../v11-notificaciones/',     name: 'Notificaciones' },
      'matches':        { path: '../v12-mis-matches/',        name: 'Mis Matches' },
      'match':          { path: '../v6-match-notification/',  name: 'Match' },
      'seguimiento':    { path: '../v7-seguimiento/',         name: 'Seguimiento' },
      'ajustes':        { path: '../v8-ajustes/',             name: 'Ajustes' },
    };

    var currentScreen = 'catalogo';
    var frame = document.getElementById('screenFrame');
    var loader = document.getElementById('loader');
    var navHistory = ['catalogo'];

    function goTo(screenId) {
      var screen = SCREENS[screenId];
      if (!screen) return;

      currentScreen = screenId;
      navHistory.push(screenId);

      // Update select
      document.getElementById('screenSelect').value = screenId;

      // Update quick actions
      document.querySelectorAll('.quick-actions button').forEach(btn => btn.classList.remove('active'));
      var activeBtn = document.getElementById('btn-' + screenId);
      if (activeBtn) activeBtn.classList.add('active');

      // Show loader and change src
      loader.classList.remove('hidden');
      frame.src = screen.path;
    }

    function onFrameLoad() {
      loader.classList.add('hidden');
    }

    function navBack() {
      if (navHistory.length > 1) {
        navHistory.pop();
        var prev = navHistory[navHistory.length - 1];
        goTo(prev);
        navHistory.pop(); // Prevent duplicate entry
      }
    }

    function refreshFrame() {
      loader.classList.remove('hidden');
      frame.src = frame.src;
    }

    window.goTo = goTo;
  </script>
<div class="treqe-bottom-nav">
  <a href="../v1-catalogo/" class="treqe-nav-item"><i class="fas fa-th"></i> Catalogo</a>
  <a href="../v12-mis-matches/" class="treqe-nav-item"><i class="fas fa-exchange-alt"></i> Intercambios</a>
  <a href="../v13-favoritos/" class="treqe-nav-item"><i class="fas fa-heart"></i> Favoritos</a>
  <a href="../v4-perfil/" class="treqe-nav-item"><i class="fas fa-user"></i> Perfil</a>
</div>

<div class="treqe-footer">(c) 2026 treqe - Todos los derechos reservados</div>

<div class="demo-tag"><i class="fas fa-flask"></i> treqe Prototype -- v0-prototype -- May 2026</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  var btn = document.querySelector(".treqe-dark-toggle i");
  if (btn) {
    if (document.body.classList.contains("dark")) {
      btn.className = "fas fa-sun";
    } else {
      btn.className = "fas fa-moon";
    }
  }
}
console.log("treqe Design System - Taylor Penton Editorial");
</script>
</body>
</html>
