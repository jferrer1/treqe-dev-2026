<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIB — Prototipo Navegable</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
/* ===== MIB Design System - Taylor Penton Editorial ===== */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #F9F7F2;
  color: #1C1915;
  min-height: 100dvh;
  padding-bottom: 90px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.2s, color 0.2s;
}
img { max-width: 100%; display: block; }
button { font-family: 'IBM Plex Mono', monospace; cursor: pointer; border: 1px solid #E5E0D8; background: transparent; border-radius: 2px; color: #1C1915; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; padding: 10px 20px; transition: all 0.15s; }
button:hover { background: #1C1915; color: #FFF; border-color: #1C1915; }
button:active { opacity: 0.7; }
a { text-decoration: none; color: inherit; }
input, textarea, select { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.9rem; border: 1px solid #E5E0D8; border-radius: 2px; padding: 10px 12px; background: #FFF; color: #1C1915; outline: none; transition: border-color 0.15s; width: 100%; }
input:focus, textarea:focus { border-color: #1C1915; }
input::placeholder, textarea::placeholder { color: #A09A94; }

/* ===== Dark Mode ===== */
body.dark { background: #130B00; color: #E8E2D6; }
body.dark input, body.dark textarea, body.dark select { background: #1A1206; border-color: #3A3630; color: #E8E2D6; }
body.dark button { border-color: #3A3630; color: #E8E2D6; }
body.dark button:hover { background: #E8E2D6; color: #130B00; border-color: #E8E2D6; }

/* ===== Typography ===== */
h1, h2, h3, h4 { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { font-size: 0.9rem; line-height: 1.5; color: #6B6560; }
body.dark p { color: #A0998F; }

/* ===== Labels / Meta ===== */
.label-mono, label, .mono-label, .tag, .badge, .chip { font-family: 'IBM Plex Mono', monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.16em; color: #A09A94; }
body.dark .label-mono, body.dark label, body.dark .mono-label, body.dark .tag { color: #6B6560; }

/* ===== Header ===== */
.mib-header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: #F9F7F2; border-bottom: 1px solid #E5E0D8;
  transition: background 0.2s, border-color 0.2s;
}
body.dark .mib-header { background: #130B00; border-color: #3A3630; }
.mib-logo { font-family: 'IBM Plex Sans', sans-serif; font-size: 1.3rem; font-weight: 700; font-style: italic; letter-spacing: -0.03em; color: #1C1915; }
body.dark .mib-logo { color: #E8E2D6; }
.mib-header-right { display: flex; align-items: center; gap: 8px; }
.mib-nav-pill { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 12px; border: 1px solid #E5E0D8; border-radius: 2px; color: #6B6560; cursor: pointer; background: transparent; transition: all 0.15s; }
body.dark .mib-nav-pill { border-color: #3A3630; color: #A0998F; }
.mib-nav-pill:hover, .mib-nav-pill.active { background: #1C1915; color: #FFF; border-color: #1C1915; }
body.dark .mib-nav-pill:hover { background: #E8E2D6; color: #130B00; border-color: #E8E2D6; }
.mib-dark-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; padding: 6px 10px; border: 1px solid #E5E0D8; border-radius: 2px; color: #6B6560; cursor: pointer; background: transparent; }
body.dark .mib-dark-toggle { border-color: #3A3630; color: #A0998F; }

/* ===== Bottom Nav ===== */
.mib-bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-around;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  background: #F9F7F2; border-top: 1px solid #E5E0D8;
  transition: background 0.2s, border-color 0.2s;
}
body.dark .mib-bottom-nav { background: #130B00; border-color: #3A3630; }
.mib-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em; color: #A09A94; text-decoration: none; padding: 4px 8px; transition: color 0.15s; }
.mib-nav-item i { font-size: 0.9rem; color: #6B6560; }
body.dark .mib-nav-item { color: #6B6560; }
body.dark .mib-nav-item i { color: #A0998F; }
.mib-nav-item.active { color: #1C1915; }
.mib-nav-item.active i { color: #1C1915; }
body.dark .mib-nav-item.active { color: #E8E2D6; }
body.dark .mib-nav-item.active i { color: #E8E2D6; }

/* ===== Cards ===== */
.mib-card { border: 1px solid #E5E0D8; border-radius: 2px; background: #FFF; padding: 16px; }
body.dark .mib-card { border-color: #3A3630; background: #1A1206; }

/* ===== Utility ===== */
.text-center { text-align: center; }
.text-sub { color: #6B6560; }
body.dark .text-sub { color: #A0998F; }
.text-dim { color: #A09A94; }
body.dark .text-dim { color: #6B6560; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.uppercase { text-transform: uppercase; }
.small { font-size: 0.7rem; }
.gap-8 { gap: 8px; }
.gap-16 { gap: 16px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.p-16 { padding: 16px; }
.px-16 { padding-left: 16px; padding-right: 16px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.w-full { width: 100%; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== Footer ===== */
.mib-footer { padding: 24px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: #A09A94; text-align: center; border-top: 1px solid #E5E0D8; margin-top: 24px; }
body.dark .mib-footer { border-color: #3A3630; color: #6B6560; }

/* ===== Status bar mock ===== */
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 2px; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: #A09A94; }
body.dark .status-bar { color: #6B6560; }
.status-bar .time { font-weight: 600; }
.status-bar .icons { display: flex; gap: 4px; }

/* ===== Form elements ===== */
.mib-input { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.9rem; border: 1px solid #E5E0D8; border-radius: 2px; padding: 10px 12px; background: #FFF; color: #1C1915; outline: none; width: 100%; }
body.dark .mib-input { background: #1A1206; border-color: #3A3630; color: #E8E2D6; }
.mib-input:focus { border-color: #1C1915; }
body.dark .mib-input:focus { border-color: #E8E2D6; }

.mib-select { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid #E5E0D8; border-radius: 2px; padding: 8px 12px; background: #FFF; color: #1C1915; outline: none; }
body.dark .mib-select { background: #1A1206; border-color: #3A3630; color: #E8E2D6; }

.mib-checkbox { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border: 1px solid #E5E0D8; border-radius: 2px; cursor: pointer; flex-shrink: 0; position: relative; background: #FFF; }
body.dark .mib-checkbox { border-color: #3A3630; background: #1A1206; }
.mib-checkbox:checked { background: #1C1915; border-color: #1C1915; }
body.dark .mib-checkbox:checked { background: #E8E2D6; border-color: #E8E2D6; }
.mib-checkbox:checked::after { content: '\2713'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #FFF; font-size: 0.6rem; font-weight: 700; }
body.dark .mib-checkbox:checked::after { color: #130B00; }

/* ===== Separator ===== */
.mib-hr { border: none; border-top: 1px solid #E5E0D8; margin: 16px 0; }
body.dark .mib-hr { border-color: #3A3630; }

/* ===== Alert / Notice ===== */
.mib-notice { border: 1px solid #E5E0D8; border-radius: 2px; padding: 12px 16px; font-size: 0.8rem; color: #6B6560; }
body.dark .mib-notice { border-color: #3A3630; color: #A0998F; }

/* ===== Pill tag ===== */
.mib-tag { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em; border: 1px solid #E5E0D8; border-radius: 2px; padding: 3px 8px; color: #6B6560; }
body.dark .mib-tag { border-color: #3A3630; color: #A0998F; }

/* ===== Demo tag ===== */
.demo-tag { font-family: 'IBM Plex Mono', monospace; font-size: 0.45rem; color: #C5C0B8; text-align: center; padding: 4px; }
body.dark .demo-tag { color: #5A5650; }

/* ===== Empty state ===== */
.mib-empty { text-align: center; padding: 48px 16px; color: #A09A94; }
body.dark .mib-empty { color: #6B6560; }
.mib-empty i { font-size: 2rem; margin-bottom: 12px; color: #C5C0B8; }
body.dark .mib-empty i { color: #5A5650; }
.mib-empty p { font-size: 0.85rem; }

/* ===== Fade animation ===== */
@keyframes fadeUp { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
<div class="mib-header">
  <a href="../v1-catalogo/" class="mib-logo">MIB</a>
  <div class="mib-header-right">
    <a href="../v13-blog/" class="mib-nav-pill"><i class="fas fa-pen"></i> Blog</a>
    <a href="../v1-catalogo/" class="mib-nav-pill"><i class="fas fa-th"></i> Catalogo</a>
    <button class="mib-dark-toggle" onclick="toggleDark()"><i class="fas fa-moon"></i></button>
  </div>
</div>

<div class="phone">
    <!-- Navigation bar -->
    <div class="nav-bar">
      <span class="logo"><a href="../v16-portada/index.html" class="mib-logo-link"><svg class="mib-logo" viewBox="0 0 76 24" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="19" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="-1.5" fill="#1C1915">MIB<text x="60" y="19" fill="#1C1915">.</text></text></svg></a></span>
      <select class="nav-select" id="screenSelect" onchange="goTo(this.value)">
        <option value="splash">🚀 Splash</option>
        <option value="onboarding">📱 Onboarding</option>
        <option value="registro">📝 Registro</option>
        <option value="catalogo" selected>🔍 Catálogo</option>
        <option value="detalle">📦 Detalle</option>
        <option value="subir">⬆️ Subir</option>
        <option value="perfil">👤 Perfil</option>
        <option value="notificaciones">🔔 Notificaciones</option>
        <option value="matches">⭐ Mis Matches</option>
        <option value="match">💱 Match</option>
        <option value="seguimiento">📍 Seguimiento</option>
        <option value="ajustes">⚙️ Ajustes</option>
      </select>
      <button class="nav-btn" onclick="navBack()" title="Volver"><i class="fas fa-arrow-left"></i></button>
      <button class="nav-btn primary" onclick="refreshFrame()" title="Recargar"><i class="fas fa-sync-alt"></i></button>
    </div>

    <!-- Quick actions -->
    <div class="quick-actions" id="quickActions">
      <button onclick="goTo('catalogo')" class="active" id="btn-catalogo">Catálogo</button>
      <button onclick="goTo('perfil')" id="btn-perfil">Perfil</button>
      <button onclick="goTo('notificaciones')" id="btn-notificaciones">Notifs</button>
      <button onclick="goTo('matches')" id="btn-matches">Matches</button>
      <button onclick="goTo('subir')" id="btn-subir">Subir</button>
      <button onclick="goTo('match')" id="btn-match">Match</button>
    </div>

    <!-- Loading -->
    <div class="loader" id="loader"><div class="spinner"></div></div>

    <!-- Screen iframe -->
    <iframe id="screenFrame" src="../v1-catalogo/" onload="onFrameLoad()"></iframe>

    <!-- Info bar -->
    <div class="info-bar">
      <span><i class="fas fa-mouse-pointer"></i> Click en pantalla para interactuar</span>
      <span><i class="fas fa-code-branch"></i> v0-prototype</span>
    </div>
  </div>

  <script>
    var SCREENS = {
      'splash':         { path: '../v9-splash/',              name: 'Splash' },
      'onboarding':     { path: '../v5-onboarding/',          name: 'Onboarding' },
      'registro':       { path: '../v10-registro/',           name: 'Registro' },
      'catalogo':       { path: '../v1-catalogo/',            name: 'Catálogo' },
      'detalle':        { path: '../v2-detalle/',             name: 'Detalle' },
      'subir':          { path: '../v3-subir/',               name: 'Subir' },
      'perfil':         { path: '../v4-perfil/',              name: 'Perfil' },
      'notificaciones': { path: '../v11-notificaciones/',     name: 'Notificaciones' },
      'matches':        { path: '../v12-mis-matches/',        name: 'Mis Matches' },
      'match':          { path: '../v6-match-notification/',  name: 'Match' },
      'seguimiento':    { path: '../v7-seguimiento/',         name: 'Seguimiento' },
      'ajustes':        { path: '../v8-ajustes/',             name: 'Ajustes' },
    };

    var currentScreen = 'catalogo';
    var frame = document.getElementById('screenFrame');
    var loader = document.getElementById('loader');
    var navHistory = ['catalogo'];

    function goTo(screenId) {
      var screen = SCREENS[screenId];
      if (!screen) return;

      currentScreen = screenId;
      navHistory.push(screenId);

      // Update select
      document.getElementById('screenSelect').value = screenId;

      // Update quick actions
      document.querySelectorAll('.quick-actions button').forEach(btn => btn.classList.remove('active'));
      var activeBtn = document.getElementById('btn-' + screenId);
      if (activeBtn) activeBtn.classList.add('active');

      // Show loader and change src
      loader.classList.remove('hidden');
      frame.src = screen.path;
    }

    function onFrameLoad() {
      loader.classList.add('hidden');
    }

    function navBack() {
      if (navHistory.length > 1) {
        navHistory.pop();
        var prev = navHistory[navHistory.length - 1];
        goTo(prev);
        navHistory.pop(); // Prevent duplicate entry
      }
    }

    function refreshFrame() {
      loader.classList.remove('hidden');
      frame.src = frame.src;
    }

    window.goTo = goTo;
  </script>
<div class="mib-bottom-nav">
  <a href="../v1-catalogo/" class="mib-nav-item"><i class="fas fa-th"></i> Catalogo</a>
  <a href="../v12-mis-matches/" class="mib-nav-item"><i class="fas fa-exchange-alt"></i> Intercambios</a>
  <a href="../v13-favoritos/" class="mib-nav-item"><i class="fas fa-heart"></i> Favoritos</a>
  <a href="../v4-perfil/" class="mib-nav-item"><i class="fas fa-user"></i> Perfil</a>
</div>

<div class="mib-footer">(c) 2026 MIB - Todos los derechos reservados</div>

<div class="demo-tag"><i class="fas fa-flask"></i> MIB Prototype -- v0-prototype -- May 2026</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  var btn = document.querySelector(".mib-dark-toggle i");
  if (btn) {
    if (document.body.classList.contains("dark")) {
      btn.className = "fas fa-sun";
    } else {
      btn.className = "fas fa-moon";
    }
  }
}
console.log("MIB Design System - Taylor Penton Editorial");
</script>
</body>
</html>
