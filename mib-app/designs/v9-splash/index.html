<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>treqe</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
  :root {
    --bg:        #F9F7F2;
    --surface:   #FFFFFF;
    --text:      #1C1915;
    --text-sub:  #6B6560;
    --text-dim:  #A09A94;
    --border:    #E5E0D8;
    --border-strong: #C5C0B8;
    --accent:    #1C1915;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-sans: 'IBM Plex Sans', 'Inter', 'Segoe UI', sans-serif;
  }

  body.dark {
    --bg:        #130B00;
    --surface:   #1A1206;
    --text:      #E8E2D6;
    --text-sub:  #A0998F;
    --text-dim:  #6B6560;
    --border:    #3A3630;
    --border-strong: #5A5650;
    --accent:    #E8E2D6;
  }

/* ══════ BOTTOM NAV ══════ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  padding: 0;
  height: 72px;
  padding-bottom: 12px;
  z-index: 100;
  isolation: isolate;
  overflow: hidden;
}

.nav-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.55rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color 0.15s;
  padding: 4px 0;
  flex: 1;
  max-width: 80px;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
}

.nav-item i { font-size: 1rem; }

.nav-item.active { color: var(--text); }
.nav-item.active i { color: var(--text); }

.nav-add-btn {
  width: 40px;
  height: 40px;
  background: var(--text);
  color: var(--bg);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
}

.nav-add-btn i { font-size: 1rem; color: var(--bg); }

.nav-badge {
  width: 5px;
  height: 5px;
  background: var(--text);
  border-radius: 50%;
  position: absolute;
  top: 2px;
  right: 4px;
}

</style>
</head>
<body>
<div class="treqe-header">
  <a href="../v1-catalogo/" class="treqe-logo" href="../v16-portada/">treqe</a>
  <div class="treqe-header-right">
    <a href="../v13-blog/" class="treqe-nav-pill"><i class="fas fa-pen"></i> Blog</a>
    <a href="../v1-catalogo/" class="treqe-nav-pill"><i class="fas fa-th"></i> Catalogo</a>
    <button class="treqe-dark-toggle" onclick="toggleDark()"><i class="fas fa-moon"></i></button>
  </div>
</div>

<div class="splash" id="splash">

    <!-- ===== DEMO REPLAY ===== -->
    <button class="demo-replay" onclick="replaySplash()">
      <i class="fas fa-redo-alt"></i> Repetir
    </button>

    <!-- ===== LOGO ===== -->
    <div class="logo-wrap" id="logoWrap">
      <div class="logo-icon">
        <i class="fas fa-arrow-left-arrow-right"></i>
      </div>
      <div class="logo-text"><a href="../v16-portada/index.html" class="treqe-logo-link"><svg class="treqe-logo" viewBox="0 0 76 24" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="19" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="-1.5" fill="#1C1915">treqe<text x="60" y="19" fill="#1C1915">.</text></text></svg></a></div>
      <div class="logo-tagline">Intercambio circular</div>
    </div>

    <!-- ===== LOADING ===== -->
    <div class="loading-wrap" id="loadingWrap">
      <div class="loading-bar">
        <div class="loading-bar__fill" id="loadFill"></div>
      </div>
      <div class="loading-label" id="loadLabel">Buscando oportunidades</div>
      <button class="loading-variant" onclick="cycleLoadingText()">↻</button>
    </div>

    <!-- ===== DEMO TAG ===== -->
    
  </div>

  <script>
    const loadingMessages = [
      'Buscando oportunidades',
      'Preparando tu catálogo',
      'Conectando artículos',
      'Afinando el algoritmo',
      'Casi listo'
    ];
    let msgIndex = 0;

    function cycleLoadingText() {
      msgIndex = (msgIndex + 1) % loadingMessages.length;
      document.getElementById('loadLabel').textContent = loadingMessages[msgIndex];
    }

    function replaySplash() {
      // Reset
      const fill = document.getElementById('loadFill');
      fill.style.animation = 'none';
      fill.offsetHeight; // force reflow
      fill.style.animation = 'loadFill 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';

      const logoWrap = document.getElementById('logoWrap');
      logoWrap.style.animation = 'none';
      logoWrap.offsetHeight;
      logoWrap.style.animation = 'fadeScaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both';

      const loadingWrap = document.getElementById('loadingWrap');
      loadingWrap.style.animation = 'none';
      loadingWrap.offsetHeight;
      loadingWrap.style.animation = 'fadeUp 0.6s ease 0.6s both';
    }

    // Auto-redirect after animation (demo)
    setTimeout(() => {
      // In real app: navigate to onboarded state or catalog
      console.log('✅ Splash complete — redirecting to catalog');
    }, 2800);

    console.log('🚀 treqe v9 — Splash Screen');
    console.log('🧪 Prototipo de diseño — 23 Abril 2026');
  </script>
<div class="treqe-footer">(c) 2026 treqe - Todos los derechos reservados</div>

<div class="demo-tag"><i class="fas fa-flask"></i> treqe Prototype -- v9-splash -- May 2026</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  var btn = document.querySelector(".treqe-dark-toggle i");
  if (btn) {
    if (document.body.classList.contains("dark")) {
      btn.className = "fas fa-sun";
    } else {
      btn.className = "fas fa-moon";
    }
  }
}
console.log("treqe Design System - Taylor Penton Editorial");
</script>
</body>
</html>
