<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TREQE — Registro</title>
    <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
:root{--bg:#F9F7F2;--surface:#FFF;--text:#1C1915;--text-sub:#6B6560;--text-dim:#A09A94;--border:#E5E0D8;--border-strong:#C5C0B8;--accent:#1C1915;}body.dark{--bg:#130B00;--surface:#1A1206;--text:#E8E2D6;--text-sub:#A0998F;--text-dim:#6B6560;--border:#3A3630;--border-strong:#5A5650;--accent:#E8E2D6;}

    .treqe-logo { height: 24px; width: 76px; flex-shrink: 0; vertical-align: middle; }
    .logo-link { display: inline-flex; text-decoration: none; line-height: 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F9F7F2;
      color: #1C1915;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { text-decoration: none; }
    input { font-family: inherit; }

    :root {
      --bg: #F9F7F2;
      --text: #1C1915;
      --text-secondary: #6B6560;
      --text-tertiary: #A09A94;
      --border: #E5E0D8;
      --accent: #1C1915;
      --accent-hover: #6B6560;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    /* ===== STATUS BAR ===== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg);
    }
    .status-bar .time { font-weight: 700; color: var(--text); }
    .status-bar .icons { display: flex; gap: 6px; font-size: 0.7rem; }

    /* ===== DEMO ===== */
    .demo-notice {
      text-align: center;
      padding: 6px 16px;
      font-size: 0.65rem;
      color: var(--text-tertiary);
      background: #F0EDE6;
      letter-spacing: 0.3px;
    }
    .demo-notice i { margin-right: 4px; }

    /* ===== SPLASH CONTAINER ===== */
    .auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 28px 32px;
      position: relative;
      overflow: hidden;
    }
    .auth-screen::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.03;
      top: -100px;
      right: -80px;
    }
    .auth-screen::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.03;
      bottom: -60px;
      left: -60px;
    }

    /* ===== SKIP ===== */
    .skip-link {
      align-self: flex-end;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-tertiary);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 2;
    }
    .skip-link:active { background: var(--border); }

    /* ===== LOGO AREA ===== */
    .auth-header {
      text-align: center;
      padding: 20px 0 32px;
      z-index: 2;
    }
    .auth-header__logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: block;
      margin: 0 auto 16px;
      object-fit: contain;
    }
    .auth-header__title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .auth-header__title span { color: var(--accent); }
    .auth-header__sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ===== SOCIAL BUTTONS ===== */
    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 2;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .social-btn:active { transform: scale(0.98); }

    .social-btn--google {
      background: var(--card-bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
    }
    .social-btn--google:active { background: #F5F3EE; border-color: #CCC; }
    .social-btn--google i { color: #4285F4; font-size: 1.2rem; }

    .social-btn--apple {
      background: #1C1915;
      color: #FFF;
    }
    .social-btn--apple:active { background: #333; }
    .social-btn--apple i { font-size: 1.3rem; }

    /* ===== DIVIDER ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
      z-index: 2;
    }
    .divider__line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider__text {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    /* ===== EMAIL BUTTON ===== */
    .email-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      background: rgba(0,0,0,0.06);
      transition: all 0.2s;
      z-index: 2;
    }
    .email-btn:active { background: rgba(0,0,0,0.06); transform: scale(0.98); }

    /* ===== BOTTOM LINK ===== */
    .auth-footer {
      margin-top: auto;
      text-align: center;
      padding: 24px 0 0;
      z-index: 2;
    }
    .auth-footer p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }
    .auth-footer a:active { opacity: 0.7; }

    .auth-footer__terms {
      font-size: 0.68rem;
      color: var(--text-tertiary);
      margin-top: 12px;
      line-height: 1.5;
    }
    .auth-footer__terms a { color: var(--text-tertiary); text-decoration: underline; }
    .auth-footer__terms a:active { color: var(--text); }

    /* ===== MANUAL FORM (hidden) ===== */
    .manual-form {
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 2;
      animation: fadeUp 0.3s ease;
    }
    .manual-form.visible { display: flex; }
    .manual-form.hidden { display: none; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .manual-form input {
      width: 100%;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--card-bg);
      outline: none;
      transition: border-color 0.2s;
    }
    .manual-form input::placeholder { color: var(--text-tertiary); }
    .manual-form input:focus { border-color: var(--accent); }

    .manual-form .name-row {
      display: flex;
      gap: 10px;
    }
    .manual-form .name-row input { flex: 1; }

    .manual-form .submit-btn {
      padding: 16px;
      background: var(--accent);
      color: #FFF;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: all 0.2s;
    }
    .manual-form .submit-btn:active { transform: scale(0.98); background: var(--accent-hover); }

    .manual-form .back-btn {
      font-size: 0.82rem;
      color: var(--text-tertiary);
      text-align: center;
      padding: 8px;
    }
    .manual-form .back-btn:active { color: var(--text); }

    /* ===== HIDE/SHOW TOGGLE ===== */
    .social-view { display: flex; flex-direction: column; flex: 1; }
    .social-view.hidden { display: none; }

      /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
      z-index: 10;
      flex-shrink: 0;
    }
    .bottom-nav__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.15s;
      cursor: pointer;
      color: var(--text-tertiary);
    }
    .bottom-nav__item:active { background: var(--border); }
    .bottom-nav__item i { font-size: 1.15rem; }
    .bottom-nav__item span {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .bottom-nav__item--active { color: var(--accent); }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 600px) {
      .auth-screen { max-width: 420px; margin: 0 auto; padding: 40px 32px 32px; }
      .bottom-nav { max-width: 420px; margin: 0 auto; border-radius: 18px 18px 0 0; }
    }

    /* ===== PASSWORD TOGGLE ===== */
    .input-wrap {
      position: relative;
    }
    .input-wrap .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 0.85rem;
      padding: 4px;
    }
    .input-wrap .toggle-pass:active { color: var(--text); }
  
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-evenly;align-items:center;height:68px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:100;}.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:"IBM Plex Mono",monospace;font-size:0.5rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);transition:color 0.15s;padding:4px 0;flex:1;max-width:80px;border:none;background:none;cursor:pointer;text-decoration:none;}.nav-item i{font-size:1.1rem;}.nav-item.active{color:var(--text);}.nav-item.active i{color:var(--text);}.nav-add-btn{width:42px;height:42px;background:var(--text);color:var(--bg);border-radius:2px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;}.nav-add-btn i{font-size:1rem;color:var(--bg);}.nav-badge{width:5px;height:5px;background:var(--text);border-radius:50%;position:absolute;top:2px;right:4px;}
</style>
</head>
<body>
  
  <!-- ===== NOTICE ===== -->
  
  <!-- ===== STATUS BAR ===== -->
  
  <!-- ===== AUTH SCREEN ===== -->
  <div class="auth-screen">

    <!-- ===== SKIP ===== -->
    <button class="skip-link" id="skipBtn" onclick="alert('🏠 Ir al catálogo (demo)')">Saltar</button>

    <!-- ===== SOCIAL VIEW ===== -->
    <div class="social-view" id="socialView">

      <!-- HEADER -->
      <div class="auth-header">
        <a href="../v16-portada/index.html" class="logo-link"><img class="auth-header__logo" src="../v1-catalogo/logo-treqe.png" alt="TREQE"></a>
        <div class="auth-header__title" id="pageTitle"><a href="../v16-portada/index.html" class="logo-link"><svg class="treqe-logo" viewBox="0 0 76 24" fill="none" xmlns="http://www.w3.org/2000/svg"><text x="0" y="19" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="-1.5" fill="#00234E">treqe<text x="60" y="19" fill="#FF6A35">.</text></text></svg></a></div>
        <div class="auth-header__sub" id="pageSubtitle">Crea tu cuenta para empezar a intercambiar</div>
      </div>

      <!-- SOCIAL BUTTONS -->
      <div class="social-buttons">
        <button class="social-btn social-btn--google" onclick="socialRegister('Google')">
          <i class="fab fa-google"></i> Continúa con Google
        </button>
        <button class="social-btn social-btn--apple" onclick="socialRegister('Apple')">
          <i class="fab fa-apple"></i> Continúa con Apple
        </button>
      </div>

      <!-- DIVIDER -->
      <div class="divider">
        <span class="divider__line"></span>
        <span class="divider__text">o</span>
        <span class="divider__line"></span>
      </div>

      <!-- EMAIL OPTION -->
      <button class="email-btn" onclick="showManual()">
        <i class="fas fa-envelope"></i> <span id="emailBtnText">Continuar con correo</span>
      </button>

      <!-- FOOTER -->
      <div class="auth-footer">
        <p id="footerPrompt">¿Ya tienes cuenta? <a id="footerLink" onclick="toggleMode()">Inicia sesión</a></p>
        <div class="auth-footer__terms">
          Al continuar aceptas los <a onclick="alert('📜 Términos (demo)')">términos</a> y la <a onclick="alert('🔒 Privacidad (demo)')">política de privacidad</a>
        </div>
      </div>
    </div>

    <!-- ===== MANUAL FORM ===== -->
    <div class="manual-form" id="manualForm">
      <div class="auth-header" style="padding-bottom:16px;">
        <div class="auth-header__title" style="font-size:1.3rem;" id="manualTitle">Crear cuenta</div>
        <div class="auth-header__sub" id="manualSub">Con tu correo electrónico</div>
      </div>

      <div class="name-row" id="nameRow">
        <input type="text" placeholder="Nombre" id="regName" value="Pepe">
        <input type="text" placeholder="Apellidos" id="regLast" value="Martínez">
      </div>
      <input type="email" placeholder="Correo electrónico" id="regEmail" value="pepe@email.com">
      
      <div class="input-wrap">
        <input type="password" placeholder="Contraseña" id="regPass" value="········">
        <button class="toggle-pass" onclick="togglePass()"><i class="far fa-eye"></i></button>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="alert('✅ Cuenta creada → Catálogo (demo)')">
        <i class="fas fa-arrow-right"></i> <span id="submitBtnText">Crear cuenta</span>
      </button>

      <div class="divider" style="padding:12px 0;">
        <span class="divider__line"></span>
        <span class="divider__text">o</span>
        <span class="divider__line"></span>
      </div>

      <div style="display:flex;gap:10px;">
        <button class="social-btn social-btn--google" style="flex:1;padding:12px;" onclick="socialRegister('Google')">
          <i class="fab fa-google"></i>
        </button>
        <button class="social-btn social-btn--apple" style="flex:1;padding:12px;" onclick="socialRegister('Apple')">
          <i class="fab fa-apple"></i>
        </button>
      </div>

      <button class="back-btn" onclick="hideManual()">
        <i class="fas fa-chevron-left"></i> Volver
      </button>
    </div>

  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <div class="bottom-nav__item" onclick="alert('🏠 Catálogo (demo)')">
      <i class="fas fa-search"></i>
      <span>Explorar</span>
    </div>
    <div class="bottom-nav__item" onclick="alert('❤️ Favoritos (demo)')">
      <i class="fas fa-heart"></i>
      <span>Favoritos</span>
    </div>
    <div class="bottom-nav__item" onclick="alert('📸 Subir (demo)')">
      <i class="fas fa-plus-circle"></i>
      <span>Subir</span>
    </div>
    <div class="bottom-nav__item" onclick="alert('💬 Mensajes (demo)')">
      <i class="fas fa-comment-dots"></i>
      <span>Mensajes</span>
    </div>
    <div class="bottom-nav__item bottom-nav__item--active">
      <i class="fas fa-user"></i>
      <span>Perfil</span>
    </div>
  </nav>

  <script>
    function socialRegister(provider) {
      const action = isLogin ? 'Inicio de sesión' : 'Registro';
      alert(`✅ ${action} con ${provider} (demo)\n\nEn producción: OAuth redirect a ${provider}`);
    }

    function showManual() {
      document.getElementById('socialView').classList.add('hidden');
      document.getElementById('manualForm').classList.remove('hidden');
      document.getElementById('manualForm').classList.add('visible');
      document.getElementById('skipBtn').style.display = 'none';
    }

    function hideManual() {
      document.getElementById('socialView').classList.remove('hidden');
      document.getElementById('manualForm').classList.remove('visible');
      document.getElementById('manualForm').classList.add('hidden');
      document.getElementById('skipBtn').style.display = 'block';
    }

    function togglePass() {
      const pass = document.getElementById('regPass');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    const isLogin = new URLSearchParams(window.location.search).get('mode') === 'login';

    function applyMode() {
      if (isLogin) {
        document.getElementById('pageSubtitle').textContent = 'Inicia sesión para seguir intercambiando';
        document.getElementById('emailBtnText').textContent = 'Continuar con correo';
        document.getElementById('manualTitle').textContent = 'Iniciar sesión';
        document.getElementById('manualSub').textContent = 'Con tu correo y contraseña';
        document.getElementById('nameRow').style.display = 'none';
        document.getElementById('submitBtnText').textContent = 'Iniciar sesión';
        document.getElementById('submitBtn').setAttribute('onclick', "alert('✅ Inicio de sesión → Catálogo (demo)')");
        document.getElementById('footerPrompt').innerHTML = '¿No tienes cuenta? <a id="footerLink" onclick="toggleMode()">Crea una</a>';
        document.title = 'TREQE — Iniciar sesión';
      } else {
        document.getElementById('pageSubtitle').textContent = 'Crea tu cuenta para empezar a intercambiar';
        document.getElementById('emailBtnText').textContent = 'Continuar con correo';
        document.getElementById('manualTitle').textContent = 'Crear cuenta';
        document.getElementById('manualSub').textContent = 'Con tu correo electrónico';
        document.getElementById('nameRow').style.display = 'flex';
        document.getElementById('submitBtnText').textContent = 'Crear cuenta';
        document.getElementById('submitBtn').setAttribute('onclick', "alert('✅ Cuenta creada → Catálogo (demo)')");
        document.getElementById('footerPrompt').innerHTML = '¿Ya tienes cuenta? <a id="footerLink" onclick="toggleMode()">Inicia sesión</a>';
        document.title = 'TREQE — Registro';
      }
    }

    function toggleMode() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'login') {
        params.delete('mode');
      } else {
        params.set('mode', 'login');
      }
      const qs = params.toString();
      const url = qs ? window.location.pathname + '?' + qs : window.location.pathname;
      window.location.href = url;
    }

    applyMode();
  </script>
</body>
</html>
