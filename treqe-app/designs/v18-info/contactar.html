<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactar — Treqe</title>
  <meta name="description" content="Contacta con el equipo de Treqe. Estamos aquí para ayudarte.">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F9F7F2;--surface:#FFFFFF;--text:#1C1915;--text-sub:#6B6560;--text-muted:#55504B;--border:#E5E0D8;--accent:#1C1915;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
    .back{display:inline-block;padding:8px 16px;font-family:var(--mono);font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:2px;background:var(--surface);margin:24px 0 0 24px}
    .wrap{max-width:640px;margin:0 auto;padding:32px 24px 80px}
    h1{font-size:1.8rem;font-weight:400;letter-spacing:-.5px;margin-bottom:8px}
    .sub{font-size:.95rem;color:var(--text-sub);margin-bottom:32px;line-height:1.6}
    form{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:32px;display:flex;flex-direction:column;gap:18px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    label{display:flex;flex-direction:column;gap:6px;font-size:.7rem;font-weight:500;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
    input,textarea{padding:10px 14px;font-size:.9rem;font-family:var(--sans);border:1px solid var(--border);border-radius:2px;background:var(--bg);color:var(--text);outline:none}
    textarea{resize:vertical;min-height:120px}
    button{padding:12px 24px;font-family:var(--mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;background:var(--accent);color:var(--bg);border:none;border-radius:2px;cursor:pointer;align-self:flex-start}
    .info{margin-top:24px;text-align:center;font-size:.8rem;color:var(--text-sub)}
    .info strong{font-family:var(--mono);font-size:.75rem;color:var(--text)}
    @media(max-width:500px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<a href="../../index.html" class="back">← Hub</a>
<main class="wrap">
  <h1>Contactar</h1>
  <p class="sub">¿Tienes preguntas, sugerencias o necesitas ayuda? Escríbenos y te responderemos lo antes posible.</p>
  <form onsubmit="alert('✅ Mensaje enviado (demo). Te responderemos en menos de 24h.');this.reset();return false">
    <div class="row">
      <label>Nombre *<input type="text" placeholder="Tu nombre" required></label>
      <label>Email *<input type="email" placeholder="tu@email.com" required></label>
    </div>
    <label>Asunto<input type="text" placeholder="¿Sobre qué nos escribes?"></label>
    <label>Mensaje *<textarea placeholder="Cuéntanos qué necesitas..." required></textarea></label>
    <button type="submit">Enviar mensaje</button>
  </form>
  <p class="info">También puedes escribirnos a <strong>soporte@treqe.es</strong></p>
</main>
</body>
</html>
