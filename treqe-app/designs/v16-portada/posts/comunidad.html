<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>treqe — Comunidad</title>
<style>
@font-face {
  font-family: 'IvyJournal';
  src: url('fonts/IvyJournal.ttf') format('truetype');
  font-weight: 700;
  font-style: italic;
}
@font-face {
  font-family: 'Elza';
  src: url('fonts/Elza-Regular.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.banner{
  width:100%;max-width:1000px;aspect-ratio:2/1;
  background:#B88CDB;position:relative;overflow:hidden;
}
.grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(16,30,69,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(16,30,69,.03) 1px,transparent 1px);
  background-size:40px 40px;
}
.copy{
  position:absolute;top:clamp(14px,2.5vw,28px);left:clamp(18px,3vw,36px);
  z-index:1;line-height:1.15;
}
.copy .italic{
  font-family:'IvyJournal','Playfair Display',serif;font-style:italic;font-weight:700;
  font-size:clamp(1rem,2.5vw,1.7rem);color:#101E45;
}
.copy .bold{
  font-family:'Elza',Inter,sans-serif;font-weight:700;
  font-size:clamp(1rem,2.5vw,1.7rem);color:#101E45;
  text-transform:uppercase;letter-spacing:-0.3px;
}
.chars{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;justify-content:center;
  padding:0 clamp(8px,1.5vw,20px);
}
.chars img{width:100%;max-width:900px;height:auto;margin-bottom:-1%;}
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="copy">
    <span class="italic">Bienvenido</span>
    <span class="bold"> A LA COMUNIDAD</span>
    <br>
    <span class="bold">DE TRUEQUE, </span><span class="italic">con o sin dinero.</span>
  </div>
  <div class="chars">
    <img src="../chars/v658-te-56-internationalyouthday_1_1.png" alt="">
  </div>
</div>
</body>
</html>
